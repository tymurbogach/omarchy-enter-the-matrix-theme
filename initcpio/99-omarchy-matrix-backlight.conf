# Installed only while the Matrix boot splash is active. Appending this hook
# would run it after Plymouth, which is too late to prevent a visible step.
# Insert it immediately before Plymouth, after udev has settled the device.
_omarchy_matrix_hooks=()
_omarchy_matrix_inserted=0
for _omarchy_matrix_hook in "${HOOKS[@]}"; do
  if [[ $_omarchy_matrix_hook == plymouth && $_omarchy_matrix_inserted == 0 ]]; then
    _omarchy_matrix_hooks+=(omarchy-matrix-backlight)
    _omarchy_matrix_inserted=1
  fi
  _omarchy_matrix_hooks+=("$_omarchy_matrix_hook")
done
if ((_omarchy_matrix_inserted)); then
  HOOKS=("${_omarchy_matrix_hooks[@]}")
fi
unset _omarchy_matrix_hooks _omarchy_matrix_inserted _omarchy_matrix_hook
